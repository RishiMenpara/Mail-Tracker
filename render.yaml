services:
  - type: web
    name: mailtrackr-api
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set this manually in the Render dashboard → Environment tab
                      # Use your Supabase "Session" pooler connection string (port 5432)
      - key: CORS_ORIGIN
        value: "*"
